site_name: OpenWAM 调研任务书
site_description: OpenWAM 仓库深度调研：方向分配说明与任务书（基于 OpenWAM-Official/OpenWAM @ 90e94ae）
site_url: https://sasasatori.github.io/kaiyuan/
repo_url: https://github.com/sasasatori/kaiyuan
edit_uri: edit/main/OpenWAM任务书/
docs_dir: OpenWAM任务书

extra_css:
  - stylesheets/extra.css

theme:
  name: material
  language: zh
  icon:
    repo: fontawesome/brands/github
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy
    - toc.follow

plugins:
  - search:
      separator: '[\s\-,:!=\[\]()"/。，；：、（）【】]+'

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite

nav:
  - 总览: README.md
  - 方向任务书:
    - 方向 A · 数据管线: 方向A-数据管线.md
    - 方向 B · 模型管线: 方向B-模型管线.md
    - 方向 C · 部署管线: 方向C-部署管线.md
    - 方向 D · 评测管线: 方向D-评测管线.md
    - 方向 E · 消融实验: 方向E-消融实验.md
    - 方向 F · 模型解剖: 方向F-模型解剖.md
